name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      scenarios:
        description: "also run the 30 dialogue scenarios (uses the ANTHROPIC_API_KEY repository secret)"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-*.in
      - name: install CPU-only test deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; else pip install -r requirements-dev.in; fi
          pip install -e . --no-deps
      - name: lint
        run: |
          ruff check .
          ruff format --check .
      - name: unit + replay tests
        run: pytest tests/unit tests/replay -m "not gpu and not api and not webcam"

  scenarios:
    if: github.event_name == 'workflow_dispatch' && inputs.scenarios
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; else pip install -r requirements-dev.in; fi
          pip install anthropic
          pip install -e . --no-deps
      - env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/run_scenarios.py --repeat 1
