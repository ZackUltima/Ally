[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ally-fall"
version = "0.1.0"
description = "Ally fall detection: data pipeline, training and evaluation"
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ally_fall --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
# F3c (D-69): the OpenCV window and key handling cannot be tested without a screen;
# the exclusion is listed in plans/sprints/f3c-review.md.
omit = ["src/ally_fall/live/view.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]
